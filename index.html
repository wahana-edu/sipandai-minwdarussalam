<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPANDAI - Sistem Informasi Pengelolaan Pembelajaran dan Administrasi Digital</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #14532d 0%, #166534 50%, #14532d 100%); }
    .card-shadow { box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    .btn-primary { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
    .btn-primary:hover { background: linear-gradient(135deg, #15803d 0%, #14532d 100%); }
    .input-focus:focus { box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2); }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media print {
      body * { visibility: hidden; }
      #print-content, #print-content * { visibility: visible; }
      #print-content { position: absolute; left: 0; top: 0; width: 210mm; }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="h-full bg-gray-50">
  <div id="app" class="h-full overflow-auto"></div>
  <script src="app.js"></script>
  <script>
    initSDKs();
    const _session = loadSession();
    if (_session) {
      const _target = pageForRole(_session.role);
      // Jaga-jaga: kalau role di sesi tidak dikenali (tidak cocok ke halaman
      // manapun), jangan redirect ke diri sendiri — itu memicu loop loading
      // tanpa henti. Hapus sesi & tampilkan form login saja.
      if (!_target || _target === 'index.html') {
        clearSession();
        renderApp();
      } else {
        window.location.href = _target;
      }
    } else {
      renderApp();
      if (new URLSearchParams(location.search).get('err') === 'role') {
        setTimeout(() => {
          const errorDiv = document.getElementById('login-error');
          if (errorDiv) {
            errorDiv.textContent = 'Role akun tidak dikenali sistem. Hubungi admin untuk memeriksa kolom Role di sheet Pengguna.';
            errorDiv.classList.remove('hidden');
          }
        }, 0);
      }
    }
  </script>
 </body>
</html>
